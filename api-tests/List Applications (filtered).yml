info:
  name: List Applications (filtered)
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseURL}}/api/users/{{userId}}/applications?status=applied"
  params:
    - name: status
      value: applied
      type: query
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

http:
  method: POST
  url: "{{baseURL}}/api/users/{{userId}}/resumes"
  body:
    type: multipart-form
    data:
      - name: resume
        type: file
        value:
          - C:\Users\szoff\Downloads\resume.pdf
        contentType: application/pdf
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("resumeId", res.getBody()._id);

settings:

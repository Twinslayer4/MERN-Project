info:
  name: Upload Resume (no token)
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseURL}}/api/users/{{userId}}/resumes"
  body:
    type: multipart-form
    data:
      - name: resume
        type: file
        value:
          - C:\Users\szoff\Downloads\resume.pdf
        contentType: application/pdf

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
